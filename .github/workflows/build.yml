name: Build & Release PRX

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v1.70)'
        required: true
        default: 'v1.70'
  push:
    branches: [main, master, feat/*]
    tags: ['v*']
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run host unit tests (no PSP SDK)
        run: |
          make -C tests run

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build PRX via Docker
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" -w "/src" pspdev/pspdev make prep psp lite

      - name: Package release (zip)
        run: |
          command -v zip >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq zip)
          make pack

      - name: Find artifacts
        id: find-artifacts
        run: |
          mkdir -p artifacts
          find build -name "*.prx" -exec cp {} artifacts/ \;
          find build -name "*.zip" -exec cp {} artifacts/ \;
          ls -la artifacts/
          echo "prx_count=$(ls artifacts/*.prx 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tempar-build
          path: artifacts/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
